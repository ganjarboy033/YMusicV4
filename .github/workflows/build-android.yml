name: Build YMusic Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout YMusic Repository
        uses: actions/checkout@v4
        with:
          path: YMusic

      - name: Checkout ffmpeg-build Repository
        uses: actions/checkout@v4
        with:
          repository: ymusic-io/ffmpeg-build
          path: ffmpeg-build
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Build FFmpeg Native Binaries
        run: |
          cd ffmpeg-build
          chmod +x scripts/build-android.sh
          ./scripts/build-android.sh arm64-v8a
          ./scripts/build-android.sh armeabi-v7a

      - name: Make Gradlew Executable
        run: |
          cd YMusic
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd YMusic
          ./gradlew :androidApp:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-Debug-APK
          path: YMusic/androidApp/build/outputs/apk/debug/*.apk
